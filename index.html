<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#1d2433;--mu:#6b7385;--bd:#dde2ec;--pr:#1f3864;--pr2:#2f5597;--ok:#1e8e4e;--okb:#d6f2e1;--no:#c62828;--nob:#fde0e0;--wa:#f2a900;--wab:#fff0c4;--in:#eef2fb}
[data-theme=dark]{--bg:#12161f;--card:#1b2130;--tx:#e8ecf5;--mu:#98a1b8;--bd:#2c3448;--pr:#4f7fd6;--pr2:#6b97e6;--ok:#4cc07e;--okb:#16372a;--no:#ff7b7b;--nob:#3d1f22;--wa:#ffc94d;--wab:#3b3216;--in:#222a3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.55}
header{background:var(--pr);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
[data-theme=dark] header{background:#1b2130;border-bottom:1px solid var(--bd)}
header h1{font-size:18px;margin:0;flex:1}
header .sub{font-size:12px;opacity:.85}
nav{display:flex;gap:4px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd);overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:transparent;color:var(--mu);padding:9px 14px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{background:var(--pr);color:#fff;font-weight:bold}
main{max-width:1150px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--pr2)}
.stat span{color:var(--mu);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;text-decoration:none}
.btn:hover{border-color:var(--pr2)}
.btn.pri{background:var(--pr);border-color:var(--pr);color:#fff}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.btn.dng{color:var(--no)}
.btn.sm{padding:4px 9px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:70px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px}
.f{margin-bottom:10px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fg input,.fg select{width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:middle}
th{background:var(--in);font-size:13px;white-space:nowrap}
.tw{overflow-x:auto}
.muted{color:var(--mu);font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--in)}
.badge.r{background:var(--nob);color:var(--no)}.badge.g{background:var(--okb);color:var(--ok)}.badge.y{background:var(--wab);color:var(--wa)}
.tg{display:inline-flex;gap:4px}
.tg button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
.tg button.P.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.tg button.A.on{background:var(--no);color:#fff;border-color:var(--no)}
.tg button.E.on{background:var(--wa);color:#222;border-color:var(--wa)}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:8px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--pr2);border-radius:5px 5px 0 0;min-height:2px}
.bars b{font-size:11px;color:var(--tx)}
.cell{display:inline-block;width:24px;height:24px;line-height:24px;border-radius:5px;text-align:center;font-size:12px;font-weight:bold}
.cell.P{background:var(--okb);color:var(--ok)}.cell.A{background:var(--nob);color:var(--no)}.cell.E{background:var(--wab);color:var(--wa)}.cell.N{background:var(--in);color:var(--mu)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:14px;max-width:760px;width:100%;padding:18px;border:1px solid var(--bd)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;border-radius:9px;display:none;z-index:30}
.empty{text-align:center;color:var(--mu);padding:26px}
.sc select{width:62px;padding:5px}
.stk{position:sticky;right:0;background:var(--card)}
header{background:linear-gradient(135deg,#1f3864,#2f5597 60%,#4a74c4)}
.card{box-shadow:0 1px 4px rgba(20,30,60,.07)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-bottom:14px}
.g2>.card{margin-bottom:0}
.stat{position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(20,30,60,.07)}
.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--ac,var(--pr2))}
.stat .ic{width:38px;height:38px;border-radius:12px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:20px;background:color-mix(in srgb,var(--ac,var(--pr2)) 16%,transparent)}
.stat b{color:var(--ac,var(--pr2))}
.hb{margin:9px 0}.hl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}

<body>
<header>
  <div style="flex:1"><h1 id="ttl">نظام متابعة اجتماع دراسة الكتاب المقدس</h1><div class="sub">الحضور • الافتقاد • التقييم الأسبوعي</div></div>
  <span class="sub" id="whoami"></span>
  <button class="btn sm" data-act="logout" id="lockBtn" style="display:none">🔒 خروج</button>

<main id="main"></main>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<div id="lock"></div>

<script>
'use strict';
const KEY='bibleStudy.v1';
const DEF_BMSG='كل سنة وانت طيب يا {الاسم} 🎂 ربنا يبارك في عمرك ويحفظك ويكمل فرحتك';
const DEF_MSG='سلام ونعمة يا {الاسم}.. افتقدناك في الاجتماع وكنا عاوزين نطمن عليك. ربنا يحفظك';
let db=load();
const state={tab:'home',q:'',att:today(),ev:today(),fuF:'pending',repQ:'',gr:''};
let bc=null;try{bc=new BroadcastChannel('bibleStudy')}catch(e){}

function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.students){d.settings=Object.assign({msg:DEF_MSG,bmsg:DEF_BMSG,bd:14,cls:'اجتماع دراسة الكتاب المقدس',theme:'light',lockMin:15},d.settings||{});d.att=d.att||{};d.ev=d.ev||{};d.fu=d.fu||[];d.users=Array.isArray(d.users)?d.users:[];return d}}catch(e){}
  return {students:[],att:{},ev:{},fu:[],users:[],settings:{msg:DEF_MSG,bmsg:DEF_BMSG,bd:14,cls:'اجتماع دراسة الكتاب المقدس',theme:'light',lockMin:15}};
}
function mkTask(sid,d){return {id:'au_'+sid+'_'+d,sid,date:d,sess:d,auto:true,open:true,method:'',result:'',note:'',next:'',done:false}}
function autoSync(id,d,quiet){
  const absent=(db.att[d]||{})[id]==='A';
  const has=db.fu.find(f=>f.sess===d&&f.sid===id);
  if(absent&&!has){db.fu.push(mkTask(id,d));const s=stu(id);if(!quiet&&s)toast('➕ '+s.name+' أضيف لقائمة الافتقاد')}
  else if(!absent&&has&&has.open){db.fu=db.fu.filter(f=>f!==has)}
}
function syncAuto(){
  const ds=sessions();if(!ds.length)return;const d=ds[ds.length-1];let n=db.fu.length;
  db.students.forEach(s=>{if(db.att[d][s.id]==='A'&&!db.fu.some(f=>f.sid===s.id&&(f.sess===d||(!f.auto&&f.date>=d))))db.fu.push(mkTask(s.id,d))});
  if(db.fu.length!==n)save();
}
const fuCount=id=>db.fu.filter(f=>f.sid===id&&!f.open).length;
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(db));bc&&bc.postMessage('upd')}catch(e){toast('تعذر الحفظ على هذا المتصفح')}}
function save(){saveLocal();schedSync()}
if(bc)bc.onmessage=()=>{db=load();applyTheme();render()};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fd(s){if(!s)return '';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
const digits=p=>String(p||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d]/g,'');
function waNum(p){let d=digits(p);if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('01'))d='2'+d;return d}
function msgFor(s){return (db.settings.msg||DEF_MSG).replace(/\{الاسم\}/g,(s.name||'').split(' ')[0])}
function contact(s){
  if(!can('contact'))return '';
  if(!s.phone)return '<span class="muted">لا يوجد رقم</span>';
  const n=digits(s.phone),m=encodeURIComponent(msgFor(s));
  return `<a class="btn sm" href="tel:${n}">📞 اتصال</a> <a class="btn sm wa" target="_blank" rel="noopener" href="https://wa.me/${waNum(s.phone)}?text=${m}">💬 واتساب</a> <a class="btn sm" href="sms:${n}?body=${m}">✉️ SMS</a>`;
}
const stu=id=>db.students.find(s=>s.id===id);
const sorted=()=>db.students.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'));
const sessions=()=>Object.keys(db.att).filter(d=>Object.keys(db.att[d]).length).sort();
function stats(id){
  const ds=sessions();let p=0,a=0,e=0,consec=0,last=null,lastD=null;
  ds.forEach(d=>{const v=db.att[d][id];if(v==='P')p++;else if(v==='A')a++;else if(v==='E')e++;if(v){last=v;lastD=d}});
  for(let i=ds.length-1;i>=0;i--){const v=db.att[ds[i]][id];if(v==='A'||v==='E')consec++;else if(v==='P')break}
  const tot=p+a+e;
  const need=db.fu.some(f=>f.sid===id&&f.open);
  const followed=last==='A'&&!!lastD&&db.fu.some(f=>f.sid===id&&!f.open&&f.date>=lastD);
  return {p,a,e,tot,pct:tot?Math.round(p/tot*100):null,consec,last,need,followed};
}
function evAvg(id){
  const s={h:0,l:0,r:0},c={h:0,l:0,r:0};
  Object.values(db.ev).forEach(day=>{const x=day[id];if(!x)return;['h','l','r'].forEach(k=>{if(x[k]!==''&&x[k]!=null){s[k]+=+x[k];c[k]++}})});
  const o={};['h','l','r'].forEach(k=>o[k]=c[k]?s[k]/c[k]:null);
  const vals=['h','l','r'].filter(k=>o[k]!=null);
  o.t=vals.length?vals.reduce((a,k)=>a+o[k],0)*(3/vals.length):null; // sum of averages, out of 15
  return o;
}
const f1=n=>n==null?'—':(Math.round(n*10)/10).toString();
function grade(t){if(t==null)return '';return t>=13?'ممتاز':t>=10?'جيد جدًا':t>=7?'جيد':'يحتاج متابعة'}
function gcls(t){return t==null?'':t>=10?'g':t>=7?'y':'r'}
function pendingFU(){return db.fu.filter(f=>f.next&&!f.done)}

/* ---------- theme ---------- */
function applyTheme(){document.documentElement.dataset.theme=db.settings.theme;$('#themeBtn').textContent=db.settings.theme==='dark'?'☀️ فاتح':'🌙 داكن';$('#ttl').textContent='نظام متابعة '+db.settings.cls}

/* ---------- render ---------- */
function render(){
  authSync();
  if(secOn()&&!ME){showLock();return}
  hideLock();
  if(TAB_PERM[state.tab]&&!can(TAB_PERM[state.tab]))state.tab='home';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));
  const oc=db.fu.filter(f=>f.open&&stu(f.sid)).length,fb=document.querySelector('#nav [data-tab="fu"]');
  if(fb)fb.innerHTML='الافتقاد'+(oc?' <span class="badge r">'+oc+'</span>':'');
  const nb=upBd().length,hb=document.querySelector('#nav [data-tab="home"]');
  if(hb)hb.innerHTML='الرئيسية'+(nb?' <span class="badge y">🎂 '+nb+'</span>':'');
  const v={home:vHome,students:vStudents,att:vAtt,eval:vEval,fu:vFu,msg:vMsg,rep:vRep,set:vSet}[state.tab];
  $('#main').innerHTML=v();
  if(state.tab==='msg')gPrev();
  applyRoleUI();
}

/* ---------- cloud sync (Firebase Realtime Database, end-to-end encrypted) ---------- */
const SK='bibleStudy.sync',BK='bibleStudy.base';
let SYNC=null;try{SYNC=JSON.parse(localStorage.getItem(SK))}catch(e){}
let sBusy=false,sAgain=false,sTimer=null,sKey=null,sStat={s:SYNC&&SYNC.on?'idle':'off',m:''},pendingRender=false;
const saveSync=()=>{try{SYNC?localStorage.setItem(SK,JSON.stringify(SYNC)):localStorage.removeItem(SK)}catch(e){}};
const b64e=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function mkKey(pass,room){const e=new TextEncoder(),km=await crypto.subtle.importKey('raw',e.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:e.encode('youth:'+room),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encO(o){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},sKey,new TextEncoder().encode(JSON.stringify(o)))),u=new Uint8Array(12+ct.length);u.set(iv);u.set(ct,12);return b64e(u)}
async function decO(s){const u=b64d(s),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},sKey,u.slice(12));return JSON.parse(new TextDecoder().decode(pt))}
async function fb(path,method,body){
  const r=await fetch(SYNC.url+'/youth/'+SYNC.room+path+'.json',{method:method||'GET',headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,cache:'no-store'});
  if(!r.ok){const e=new Error('HTTP '+r.status);e.http=r.status;throw e}return r.json();
}
/* flatten the database into key -> string so devices can be merged key by key (3-way) */
function flat(d){
  const m={};d.students.forEach(s=>m['s:'+s.id]=JSON.stringify(s));
  Object.keys(d.att).forEach(dt=>Object.keys(d.att[dt]).forEach(id=>m['a:'+dt+':'+id]=d.att[dt][id]));
  Object.keys(d.ev).forEach(dt=>Object.keys(d.ev[dt]).forEach(id=>m['e:'+dt+':'+id]=JSON.stringify(d.ev[dt][id])));
  d.fu.forEach(f=>m['f:'+f.id]=JSON.stringify(f));
  (d.users||[]).forEach(u=>m['u:'+u.id]=JSON.stringify(u));
  ['msg','bmsg','bd','cls','lockMin'].forEach(k=>{if(d.settings[k]!=null)m['x:'+k]=JSON.stringify(d.settings[k])});
  return m;
}
function unflat(m){
  const o={students:[],att:{},ev:{},fu:[],users:[],set:{}};
  for(const k in m){const t=k[0],v=m[k];
    if(t==='s')o.students.push(JSON.parse(v));
    else if(t==='a'){const [,dt,id]=k.split(':');(o.att[dt]=o.att[dt]||{})[id]=v}
    else if(t==='e'){const [,dt,id]=k.split(':');(o.ev[dt]=o.ev[dt]||{})[id]=JSON.parse(v)}
    else if(t==='f')o.fu.push(JSON.parse(v));
    else if(t==='u')o.users.push(JSON.parse(v));
    else if(t==='x')o.set[k.slice(2)]=JSON.parse(v);
  }
  return o;
}
function merge3(b,l,r){
  const out={};new Set([...Object.keys(b),...Object.keys(l),...Object.keys(r)]).forEach(k=>{
    const bv=b[k],lv=l[k],rv=r[k];let v;
    if(lv===rv)v=lv;else if(lv===bv)v=rv;else if(rv===bv)v=lv;else v=lv;   // both changed: this device wins
    if(v!==undefined)out[k]=v});
  return out;
}
const sameMap=(a,b)=>{const ka=Object.keys(a);return ka.length===Object.keys(b).length&&ka.every(k=>a[k]===b[k])};
function dedupeFu(){const m={};db.fu.forEach(f=>{if(!f.sess)return;const k=f.sid+'|'+f.sess;if(!m[k]||(m[k].open&&!f.open))m[k]=f});db.fu=db.fu.filter(f=>!f.sess||m[f.sid+'|'+f.sess]===f)}
function applyFlat(mf){
  const o=unflat(mf);db.students=o.students;db.att=o.att;db.ev=o.ev;db.fu=o.fu;db.users=o.users;Object.assign(db.settings,o.set);dedupeFu();saveLocal();
  const a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest('#main'))pendingRender=true;else{applyTheme();render()}
}
function setStat(s,m){
  sStat={s,m:m||''};const c=$('#syncChip');if(!c)return;
  const tm=new Date();const hm=String(tm.getHours()).padStart(2,'0')+':'+String(tm.getMinutes()).padStart(2,'0');
  c.textContent={off:'☁ المزامنة: غير مفعّلة',busy:'☁ جارٍ المزامنة…',ok:'☁ متزامن ✓ '+hm,idle:'☁ المزامنة مفعّلة',offline:'☁ غير متصل',err:'☁ ⚠ خطأ في المزامنة'}[s]||'☁';
  c.title=m||'';
}
function syncErr(e){
  if(e&&e.name==='OperationError')return 'كلمة السر غير مطابقة لبيانات هذه الغرفة';
  if(e&&(e.http===401||e.http===403))return 'قاعدة البيانات ترفض الوصول — راجع الـ Rules';
  if(e&&e.http===404)return 'رابط قاعدة البيانات غير صحيح';
  if(e&&(e.name==='TypeError'))return 'تعذر الاتصال بالإنترنت أو الرابط غير صحيح';
  return 'خطأ: '+(e&&e.message||e);
}
function schedSync(){if(SYNC&&SYNC.on){clearTimeout(sTimer);sTimer=setTimeout(syncNow,1500)}}
const hkc={};
async function hk(k){if(hkc[k])return hkc[k];const d=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(SYNC.pass+'|'+SYNC.room+'|'+k)));let s='';for(let i=0;i<16;i++)s+=d[i].toString(16).padStart(2,'0');return hkc[k]=s}
const needPull=hd=>!SYNC.seen||Object.keys(hd).some(d=>d!==SYNC.dev&&hd[d]!==SYNC.seen[d]);
/* every record is its own encrypted node, so devices never overwrite each other's data;
   a small "heads" node (one token per device) tells the others that something changed */
async function syncNow(){
  if(!SYNC||!SYNC.on)return false;
  if(sBusy){sAgain=true;return false}
  if(!navigator.onLine){setStat('offline');return false}
  sBusy=true;setStat('busy');let ok=false;
  try{
    if(!sKey)sKey=await mkKey(SYNC.pass,SYNC.room);
    const hd=(await fb('/heads'))||{};
    let base={};try{base=JSON.parse(localStorage.getItem(BK))||{}}catch(e){}
    const pull=needPull(hd);let rf=base;
    if(pull){rf={};const raw=(await fb('/k'))||{};for(const id in raw){const e=await decO(raw[id]);rf[e.k]=e.v}}
    const lf=flat(db),mf=merge3(base,lf,rf);
    if(!sameMap(mf,lf))applyFlat(mf);
    const patch={};let n=0;
    for(const k of new Set([...Object.keys(mf),...Object.keys(rf)])){
      if(mf[k]!==rf[k]){patch['k/'+await hk(k)]=mf[k]===undefined?null:await encO({k,v:mf[k]});n++}}
    const seen=pull?Object.assign({},hd):Object.assign({},SYNC.seen||{});
    if(n){const tok=Date.now()+'-'+Math.random().toString(36).slice(2,6);patch['heads/'+SYNC.dev]=tok;await fb('','PATCH',patch);seen[SYNC.dev]=tok}
    localStorage.setItem(BK,JSON.stringify(mf));SYNC.seen=seen;saveSync();setStat('ok');ok=true;
  }catch(e){setStat('err',syncErr(e))}
  finally{sBusy=false;if(sAgain){sAgain=false;setTimeout(syncNow,800)}}
  return ok;
}
async function connectSync(url,room,pass){
  if(!window.crypto||!crypto.subtle){toast('المتصفح لا يدعم التشفير — افتح الملف من Chrome');return}
  url=url.trim().replace(/\/+$/,'');
  if(!/^https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/i.test(url)){toast('رابط قاعدة البيانات غير صحيح');return}
  if(!/^[A-Za-z0-9_-]{10,}$/.test(room)){toast('اسم الغرفة: 10 حروف أو أرقام (إنجليزي) على الأقل');return}
  if((pass||'').length<6){toast('كلمة السر 6 أحرف على الأقل');return}
  const old=SYNC;SYNC={url,room,pass,on:true,dev:Math.random().toString(36).slice(2,10),seen:null};sKey=null;localStorage.removeItem(BK);Object.keys(hkc).forEach(k=>delete hkc[k]);
  toast('جارٍ الاتصال…');
  const ok=await syncNow();
  if(!ok){const m=sStat.m||'تعذر الاتصال';SYNC=old;sKey=null;saveSync();setStat(old&&old.on?'idle':'off');toast('⚠ '+m);render();return}
  saveSync();toast('تم تفعيل المزامنة ✓');render();
}
function syncCodeOf(){return 'YT1.'+btoa(unescape(encodeURIComponent(JSON.stringify({u:SYNC.url,r:SYNC.room,p:SYNC.pass}))))}
function syncCard(){
  const on=SYNC&&SYNC.on;
  const RULES='{"rules":{".read":false,".write":false,"youth":{"$room":{".read":true,".write":true}}}}';
  return `<div class="card"><h2>☁ المزامنة بين الأجهزة</h2>
  ${on?`<p>✅ المزامنة <b>مفعّلة</b>: أي تعديل يظهر على باقي الأجهزة خلال ثوانٍ. ${sStat.s==='err'?`<span class="badge r">${esc(sStat.m)}</span>`:''}</p>
  <div class="row"><button class="btn pri" data-act="syncNow">🔄 مزامنة الآن</button><button class="btn" data-act="syncCode">🔗 رمز الربط لجهاز آخر</button><button class="btn dng" data-act="syncOff">إيقاف المزامنة</button></div><div id="syncCodeBox" style="margin-top:10px"></div>`
  :`<p class="muted" style="margin-top:0">لتستخدم النظام من أكثر من جهاز (موبايل + كمبيوتر + خادم آخر) بنفس البيانات. تحتاج تجهيزًا لمرة واحدة بحساب جوجل (مجاني).</p>
  <details><summary><b>① خطوات التجهيز</b></summary><ol class="muted" style="line-height:2">
  <li>ادخل <b>console.firebase.google.com</b> واضغط <b>Create a project</b> (اسم أي شيء، وعطّل Google Analytics).</li>
  <li>من القائمة: <b>Build ← Realtime Database ← Create Database</b>، واختر أي موقع ثم <b>Start in locked mode</b>.</li>

function syncInit(){

/* ---------- duplicates ---------- */
function nName(s){return String(s||'').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim().toLowerCase()}
function nPhone(p){let d=digits(p);if(d.startsWith('0020'))d=d.slice(4);else if(d.startsWith('20')&&d.length>=12)d=d.slice(2);return d.replace(/^0+/,'')}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[];for(let j=0;j<=n;j++)p[j]=j;for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function dupWhy(n,ph,s){
  const sn=nName(s.name);
  if(n&&sn===n)return 'اسم مطابق';
  if(ph.length>=7&&nPhone(s.phone)===ph)return 'نفس رقم التليفون';
  if(n&&sn&&n.length>=6&&sn.length>=6){
    const [sh,lo]=n.length<=sn.length?[n,sn]:[sn,n];
    if(sh.split(' ').length>=2&&lo.startsWith(sh+' '))return 'اسم مشابه';
    if(lev(n,sn)<=(Math.max(n.length,sn.length)>=10?2:1))return 'اسم مشابه';
  }
  return null;
}
function findDups(name,phone,ex){
  const n=nName(name),ph=nPhone(phone),out=[];
  db.students.forEach(s=>{if(s.id===ex)return;const w=dupWhy(n,ph,s);if(w)out.push({s,why:w})});
  return out;
}
function dupWarn(){
  const w=$('#dupw');if(!w)return 0;
  const id=$('#fSave').dataset.id,d=findDups($('#fN').value,$('#fP').value,id);
  w.innerHTML=d.length?`<div class="card" style="background:var(--wab);border-color:var(--wa)"><b>⚠ تنبيه: تكرار محتمل</b>${d.map(x=>`<div class="row sp" style="margin-top:6px"><span>${esc(x.s.name)} <span class="badge y">${x.why}</span> <span class="muted">${esc(x.s.phone||'')}</span></span><a href="#" data-act="profile" data-id="${x.s.id}">فتح الموجود</a></div>`).join('')}<div style="margin-top:8px"><button class="btn sm" data-act="saveStudent" data-id="${esc(id)}" data-force="1">حفظ رغم ذلك (شخص مختلف)</button></div></div>`:'';
  return d.length;
}
let DG=[];
function dupGroups(){
  const ss=sorted(),par=ss.map((_,i)=>i),f=i=>par[i]===i?i:(par[i]=f(par[i]));
  const nn=ss.map(s=>nName(s.name)),pp=ss.map(s=>nPhone(s.phone));
  for(let i=0;i<ss.length;i++)for(let j=i+1;j<ss.length;j++){if(dupWhy(nn[i],pp[i],ss[j]))par[f(j)]=f(i)}
  const m={};ss.forEach((s,i)=>{(m[f(i)]=m[f(i)]||[]).push(s)});
  return Object.values(m).filter(g=>g.length>1);
}
const recCount=id=>Object.values(db.att).filter(d=>d[id]!=null).length+Object.values(db.ev).filter(d=>d[id]).length+db.fu.filter(f=>f.sid===id).length;
function mergeInto(pid,oid){
  const p=stu(pid),o=stu(oid);if(!p||!o||pid===oid)return;
  ['phone','parentPhone','address','birth','grade'].forEach(k=>{if(!p[k]&&o[k])p[k]=o[k]});
  if(o.notes&&!(p.notes||'').includes(o.notes))p.notes=[p.notes,o.notes].filter(Boolean).join(' | ');
  Object.values(db.att).forEach(d=>{if(d[oid]!=null){if(d[pid]==null||d[oid]==='P')d[pid]=d[oid];delete d[oid]}});
  Object.values(db.ev).forEach(d=>{if(d[oid]){if(!d[pid])d[pid]=d[oid];delete d[oid]}});
  db.fu.forEach(f=>{if(f.sid===oid)f.sid=pid});
  const m={};db.fu.forEach(f=>{if(!f.sess)return;const k=f.sid+'|'+f.sess;if(!m[k]||(m[k].open&&!f.open))m[k]=f});
  db.fu=db.fu.filter(f=>!f.sess||m[f.sid+'|'+f.sess]===f);
  db.students=db.students.filter(s=>s.id!==oid);delete G.sel[oid];delete G.sent[oid];
}

/* ---------- grade + birthday ---------- */
const GR=['رجال','سيدات'];
const GC={'رجال':'#2f5597','سيدات':'#c2185b'};
const fsorted=()=>sorted().filter(s=>!state.gr||s.grade===state.gr);
const grBadge=s=>{if(!s.grade)return '';const c=GC[s.grade]||'#6b7385';return `<span class="badge" style="background:${c}22;color:${c}">${esc(s.grade)}</span>`};
function grChips(){return `<div class="row noprint" style="margin-top:10px"><span class="muted">الفئة:</span>${['',...GR].map(g=>`<button class="btn sm ${state.gr===g?'pri':''}" data-act="gr" data-v="${g}">${g||'الكل'} (${g?db.students.filter(s=>s.grade===g).length:db.students.length})</button>`).join('')}</div>`}
function bday(s){
  if(!s.birth)return null;const p=s.birth.split('-').map(Number);if(p.length<3||!p[0])return null;
  const t=new Date(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  let n=new Date(t0.getFullYear(),p[1]-1,p[2]);if(n<t0)n=new Date(t0.getFullYear()+1,p[1]-1,p[2]);
  return {days:Math.round((n-t0)/864e5),age:n.getFullYear()-p[0],date:n};
}
const bdWin=()=>+db.settings.bd||14;
const upBd=()=>sorted().map(s=>({s,b:bday(s)})).filter(x=>x.b&&x.b.days<=bdWin()).sort((a,b)=>a.b.days-b.b.days);
const bdTxt=d=>d===0?'النهاردة 🎉':d===1?'بكرة':d===2?'بعد يومين':'بعد '+d+' يوم';
const dm=d=>d.getDate()+'/'+(d.getMonth()+1);
const bdBadge=s=>{const b=bday(s);return b&&b.days<=bdWin()?` <span class="badge y">🎂 ${bdTxt(b.days)}</span>`:''};
const bdNote=s=>{const b=bday(s);return b&&b.days<=bdWin()?' — عيد ميلاده '+bdTxt(b.days):''};
function wishBtn(s){if(!s.phone||!can('contact'))return '';return `<a class="btn sm wa" target="_blank" rel="noopener" href="https://wa.me/${waNum(s.phone)}?text=${encodeURIComponent((db.settings.bmsg||DEF_BMSG).replace(/\{الاسم\}/g,(s.name||'').split(' ')[0]))}">🎂 تهنئة واتساب</a>`}
function bdCard(){

function gradeCharts(rows){
  if(!rows.some(r=>r.s.grade))return '';
  const gs=GR.map(g=>{const rs=rows.filter(r=>r.s.grade===g);let p=0,t=0;rs.forEach(r=>{p+=r.t.p;t+=r.t.tot});return {g,n:rs.length,pct:t?Math.round(p/t*100):null}});
  const un=rows.filter(r=>!r.s.grade).length;
  const parts=gs.map(x=>({v:x.n,c:GC[x.g]})),leg=gs.map(x=>({c:GC[x.g],l:x.g,v:x.n}));

/* ---------- charts ---------- */
const COL={P:'#1e8e4e',A:'#e04848',E:'#f2a900'};
const pc=v=>v>=80?'#1e8e4e':v>=60?'#f2a900':'#e04848';
function donut(parts,center,sub,size){
  size=size||150;const r=52,C=2*Math.PI*r,tot=parts.reduce((a,p)=>a+p.v,0);let off=0;
  const segs=tot?parts.filter(p=>p.v>0).map(p=>{const len=p.v/tot*C;const s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join(''):'';
  return `<svg viewBox="0 0 140 140" width="${size}" height="${size}"><circle cx="70" cy="70" r="${r}" fill="none" style="stroke:var(--in)" stroke-width="18"/>${segs}<text x="70" y="75" text-anchor="middle" style="fill:var(--tx);font-size:24px;font-weight:bold">${center}</text><text x="70" y="94" text-anchor="middle" style="fill:var(--mu);font-size:10px">${sub||''}</text></svg>`;
}
function legend(items){return `<div class="lg">${items.map(i=>`<span><i style="background:${i.c}"></i>${i.l} <b>${i.v}</b></span>`).join('')}</div>`}
function hbar(label,val,max,color,txt){const w=Math.max(0,Math.min(100,max?val/max*100:0));return `<div class="hb"><div class="hl"><span>${label}</span><b>${txt}</b></div><div class="ht"><i style="width:${w}%;background:linear-gradient(90deg,${color},${color}aa)"></i></div></div>`}
function stack(c){const t=c.P+c.A+c.E;if(!t)return '';return `<div class="stack">${[['P'],['A'],['E']].map(([k])=>c[k]?`<i style="width:${c[k]/t*100}%;background:${COL[k]}"></i>`:'').join('')}</div>`}
function lineChart(pts){
  const W=560,H=200,pl=34,pr=16,pt=22,pb=28,n=pts.length,iw=W-pl-pr,ih=H-pt-pb;
  const ins=26,X=i=>n===1?pl+iw/2:W-pr-ins-i*(iw-2*ins)/(n-1),Y=v=>pt+ih-(v/100)*ih;
  let g='';[0,25,50,75,100].forEach(v=>g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--bd)" stroke-dasharray="3 3"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" style="fill:var(--mu);font-size:10px">${v}%</text>`);
  const q=pts.map((p,i)=>[X(i),Y(p.v)]);
  const line=q.map((a,i)=>(i?'L':'M')+a[0].toFixed(1)+' '+a[1].toFixed(1)).join(' ');
  const area=line+` L${q[n-1][0].toFixed(1)} ${Y(0)} L${q[0][0].toFixed(1)} ${Y(0)} Z`;
  const dots=q.map((a,i)=>`<circle cx="${a[0]}" cy="${a[1]}" r="4.5" style="fill:var(--card);stroke:var(--pr2)" stroke-width="2.5"/><text x="${a[0]}" y="${a[1]-10}" text-anchor="middle" style="fill:var(--tx);font-size:10px;font-weight:bold">${pts[i].v}</text><text x="${a[0]}" y="${H-8}" text-anchor="middle" style="fill:var(--mu);font-size:10px">${fd(pts[i].d).slice(0,5)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><defs><linearGradient id="lgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--pr2);stop-opacity:.4"/><stop offset="1" style="stop-color:var(--pr2);stop-opacity:0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#lgA)"/><path d="${line}" fill="none" style="stroke:var(--pr2)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}
function evAll(){

function profile(id){

  const fus=db.fu.filter(f=>f.sid===id&&!f.open).sort((a,b)=>b.date.localeCompare(a.date));
  openM(`<div class="row sp"><h2 style="margin:0;display:flex;align-items:center">${av(s,64)}${esc(s.name)}</h2><button class="btn sm" data-act="closeM">✕</button></div>

  ${profCharts(t,e)}
  <h3>آخر الاجتماعات</h3><div class="row" style="gap:4px">${ds.map(d=>{const v=db.att[d][id];return `<span title="${fd(d)}" style="text-align:center;font-size:11px"><span class="cell ${v||'N'}">${v==='P'?'ح':v==='A'?'غ':v==='E'?'ع':'·'}</span><br>${fd(d).slice(0,5)}</span>`}).join('')||'<span class="muted">لا يوجد</span>'}</div>
  <h3>التقييمات</h3>${evs.length?`<table>${evs.map(d=>{const x=db.ev[d][id];const tt=totalOf(x);return `<tr><td>${fd(d)}</td><td>${tt==null?'':tt+'/15'}</td><td>${esc(x.n||'')}</td></tr>`}).join('')}</table>`:'<span class="muted">لا يوجد</span>'}
  <h3>الافتقاد</h3>${fus.length?`<table>${fus.map(f=>`<tr><td>${fd(f.date)}</td><td>${esc(f.method)}</td><td>${esc(f.result)} ${esc(f.note)}</td></tr>`).join('')}</table>`:'<span class="muted">لا يوجد</span>'}`);
}

/* ---------- csv / files ---------- */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csv(rows){return '\ufeff'+rows.map(r=>r.map(c=>{c=String(c==null?'':c);if(/^[=+\-@]/.test(c))c="'"+c;return '"'+c.replace(/"/g,'""')+'"'}).join(',')).join('\r\n')}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){state.tab=tb.dataset.tab;render();return}
  if(e.target.id==='modal'){closeM();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  if(secOn()){if(!ME)return;const need=ACT_PERM[a];if(need&&!can(need)){e.preventDefault();toast('🔒 ليس لديك صلاحية لهذا الإجراء');return}if(LOG_ACT[a])logEv(LOG_ACT[a])}
  if(a==='profile'||a==='fuNew'||a==='editStudent'||a==='closeM'||t.tagName==='A'&&t.getAttribute('href')==='#')e.preventDefault();
  switch(a){
    case 'theme':db.settings.theme=db.settings.theme==='dark'?'light':'dark';save();applyTheme();break;

    case 'editStudent':studentForm(stu(id));break;
    case 'closeM':closeM();break;
    case 'saveStudent':{
      const name=$('#fN').value.trim();if(!name){toast('اكتب الاسم');return}

      const o={photo:FPH,name,phone:$('#fP').value.trim(),parentPhone:$('#fPP').value.trim(),birth:$('#fB').value,address:$('#fA').value.trim(),notes:$('#fT').value.trim(),grade:$('#fG').value};
      if(id){Object.assign(stu(id),o)}else db.students.push(Object.assign({id:uid()},o));
      save();closeM();render();toast('تم الحفظ');break}
    case 'delStudent':{const s=stu(id);if(s&&confirm('حذف '+s.name+' وكل سجلاته؟')){logEv('حذف عضو: '+s.name);db.students=db.students.filter(x=>x.id!==id);Object.values(db.att).forEach(d=>delete d[id]);Object.values(db.ev).forEach(d=>delete d[id]);db.fu=db.fu.filter(f=>f.sid!==id);save();render()}break}
    case 'profile':profile(id);break;
    case 'setAtt':{const d=state.att;db.att[d]=db.att[d]||{};const v=t.dataset.v;if(db.att[d][id]===v)delete db.att[d][id];else db.att[d][id]=v;autoSync(id,d);save();render();break}
    case 'allP':{const d=state.att;db.att[d]=db.att[d]||{};db.students.forEach(s=>{db.att[d][s.id]='P';autoSync(s.id,d,true)});save();render();break}
    case 'clearAtt':if(confirm('مسح حضور '+fd(state.att)+'؟')){delete db.att[state.att];db.students.forEach(s=>autoSync(s.id,state.att,true));save();render()}break;
    case 'syncChip':if(SYNC&&SYNC.on)syncNow();else{state.tab='set';render();window.scrollTo(0,0)}break;
    case 'syncNow':syncNow().then(ok=>{if(ok)toast('تمت المزامنة ✓');else if(sStat.s==='err')toast('⚠ '+sStat.m)});break;
    case 'syncRules':copyT('{"rules":{".read":false,".write":false,"youth":{"$room":{".read":true,".write":true}}}}');break;
    case 'syncGen':{const a=crypto.getRandomValues(new Uint8Array(12));$('#syRoom').value=Array.from(a,x=>'abcdefghijkmnpqrstuvwxyz23456789'[x%32]).join('');break}
    case 'syncConnect':connectSync($('#syUrl').value,$('#syRoom').value.trim(),$('#syPass').value);break;
    case 'syncPaste':{try{const c=$('#syCode').value.trim();if(!c.startsWith('YT1.'))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));connectSync(o.u,o.r,o.p)}catch(x){toast('رمز الربط غير صحيح')}break}
    case 'syncCode':{const b=$('#syncCodeBox');b.innerHTML='<div class="muted">انسخ الرمز والصقه في «بيانات الربط ③» على الجهاز الآخر (سري، يحتوي كلمة السر):</div><textarea readonly dir="ltr" style="min-height:70px">'+esc(syncCodeOf())+'</textarea><button class="btn sm" id="cpCode">📋 نسخ</button>';$('#cpCode').onclick=()=>copyT(syncCodeOf());break}
    case 'syncOff':if(confirm('إيقاف المزامنة على هذا الجهاز؟ ستبقى بياناته محفوظة عليه ولن تتزامن.')){SYNC=null;sKey=null;saveSync();localStorage.removeItem(BK);setStat('off');render()}break;
    case 'dupRev':dupReview();break;
    case 'mergeG':{const g=DG[+t.dataset.g];if(!g)break;const r=document.querySelector('input[name=dg'+t.dataset.g+']:checked');if(!r)break;
      const keep=r.value,names=g.filter(s=>s.id!==keep).map(s=>s.name).join('، ');
      if(!confirm('دمج ('+names+') في السجل الأساسي؟ لا يمكن التراجع.'))break;
      g.forEach(s=>{if(s.id!==keep)mergeInto(keep,s.id)});logEv('دمج سجلات مكررة: '+names);save();render();dupReview();toast('تم الدمج ✓');break}
    case 'gneed':{G.sel={};db.students.forEach(s=>{if(stats(s.id).need)G.sel[s.id]=1});G.text=null;G.track=true;G.sent={};G.smsPending=false;state.tab='msg';render();window.scrollTo(0,0);break}
    case 'gsel':{const v=t.dataset.v;G.sel={};db.students.forEach(s=>{if(v==='all'||(v==='absent'&&stats(s.id).last==='A')||(v==='need'&&stats(s.id).need)||(v.startsWith('g:')&&s.grade===v.slice(2)))G.sel[s.id]=1});render();break}
    case 'gwho':G.who=t.dataset.v;render();break;
    case 'gpreset':{const x=gPresets().find(p=>p[0]===t.dataset.v);G.text=x[2];G.track=x[3];render();break}
    case 'gwa':{const s=stu(id);if(s){gWa(s);render()}break}
    case 'gnext':{const s=gRecips().find(x=>!G.sent[x.id]);if(!s){toast('تم فتح كل المحادثات ✓');break}gWa(s);render();break}
    case 'gsmsone':{const s=stu(id);if(s){markSent(id,'SMS');render();location.href='sms:'+digits(gNum(s))+'?body='+encodeURIComponent(gMsg(s))}break}
    case 'gsms':{const nums=gRecips().map(s=>digits(gNum(s))).join(',');G.smsPending=true;render();location.href='sms:'+nums+'?body='+encodeURIComponent(gGroupMsg());break}
    case 'gsmslog':{gRecips().forEach(s=>markSent(s.id,'SMS'));G.smsPending=false;render();toast('تم التسجيل ✓');break}
    case 'gsmsno':G.smsPending=false;render();break;
    case 'gcopym':copyT(gGroupMsg().length&&/\{الاسم\}/.test(gText())?gText().replace(/\s*يا\s*\{الاسم\}/g,'').replace(/\{الاسم\}/g,'').trim():gText());break;
    case 'gcopyn':copyT(gRecips().map(s=>digits(gNum(s))).join('\n'));break;
    case 'greset':G.sent={};G.smsPending=false;render();break;
    case 'gr':state.gr=t.dataset.v;render();break;
    case 'goFu':state.tab='fu';render();break;
    case 'goAtt':state.att=t.dataset.d;render();break;

    case 'dateMove':dateMove(t.dataset.d);break;
    case 'dateDel':dateDel(t.dataset.d);break;
    case 'bgClear':if(confirm('إزالة كل الخلفيات؟')){BG={page:'',head:'',op:BG.op};saveBG();applyBG();render()}break;
    case 'bgDef':delete BG.page;delete BG.head;saveBG();applyBG();render();toast('تم استرجاع صورة مارمينا');break;
    case 'fuNew':closeM();state.tab='fu';render();$('#fuS').value=id;window.scrollTo(0,0);break;

      save();render();toast('تم تسجيل الافتقاد');break}
    case 'fuClose':{const f=db.fu.find(x=>x.id===id);if(f){f.open=false;f.method=$('#fm-'+id).value;f.result=$('#fr-'+id).value.trim();f.next=$('#fn-'+id).value;f.date=today();save();render();toast('تم تسجيل الافتقاد ✓')}break}
    case 'fuDone':{const f=db.fu.find(x=>x.id===id);if(f){f.done=true;save();render()}break}

    case 'fuF':state.fuF=t.dataset.v;render();break;
    case 'saveSet':db.settings.cls=$('#sCls').value.trim()||'اجتماع دراسة الكتاب المقدس';db.settings.msg=$('#sMsg').value.trim()||DEF_MSG;db.settings.bmsg=$('#sBm').value.trim()||DEF_BMSG;db.settings.bd=Math.max(1,Math.min(60,+$('#sBd').value||14));save();applyTheme();toast('تم الحفظ');break;
    case 'exp':expBackup();break;
    case 'csvStu':dl('الأعضاء.csv',csv([['الاسم','الفئة','التليفون','تليفون آخر','العنوان','تاريخ الميلاد','ملاحظات']].concat(sorted().map(s=>[s.name,s.grade||'',s.phone,s.parentPhone,s.address,s.birth,s.notes]))),'text/csv');break;

    case 'csvMat':{const ds=sessions();dl('جدول_الحضور.csv',csv([['الاسم'].concat(ds.map(fd))].concat(sorted().map(s=>[s.name].concat(ds.map(d=>({P:'حاضر',A:'غائب',E:'بعذر'}[db.att[d][s.id]]||'')))))),'text/csv');break}
    case 'print':window.print();break;
    case 'sample':{if(db.students.length&&!confirm('سيتم إضافة بيانات تجريبية للموجود. متابعة؟'))return;sample();break}

  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='attDate'){state.att=t.value||today();render()}
  else if(t.id==='evDate'){state.ev=t.value||today();render()}
  else if(t.dataset&&t.dataset.ev){if(!can('eval')){render();return}
    const d=state.ev;db.ev[d]=db.ev[d]||{};const x=db.ev[d][t.dataset.id]=db.ev[d][t.dataset.id]||{};x[t.dataset.ev]=t.value;save();
    const c=$('#tot-'+t.dataset.id);if(c)c.innerHTML=tHtml(totalOf(x));
  }
  else if(t.dataset&&t.dataset.gck){if(t.checked)G.sel[t.dataset.gck]=1;else delete G.sel[t.dataset.gck];render()}
  else if(t.id==='gtrack'){G.track=t.checked}
  else if(t.id==='imp'){
    if(!can('cfg'))return;
    const f=t.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>restoreFile(r.result);r.readAsText(f);t.value='';
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){state.q=t.value;const p=t.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}
  else if(t.id==='fN'||t.id==='fP'){dupWarn()}
  else if(t.id==='gtext'){G.text=t.value;gPrev()}
  else if(t.dataset&&t.dataset.evn!==undefined){if(!can('eval'))return;
    const d=state.ev;db.ev[d]=db.ev[d]||{};const x=db.ev[d][t.dataset.id]=db.ev[d][t.dataset.id]||{};x.n=t.value;
    clearTimeout(input.t);input.t=setTimeout(save,400);
  }
});
function input(){}

function sample(){
  const names=[['مينا جرجس','01012345678'],['مريم فهمي','01123456789'],['بيشوي سمير','01234567890'],['سارة عادل','01512345678'],['مارك أشرف','01098765432'],['إيريني هاني','01187654321']];
  names.forEach(([n,p],i)=>{if(!db.students.some(s=>s.name===n)){const b=new Date();b.setDate(b.getDate()+i*3);db.students.push({id:uid(),name:n,phone:p,parentPhone:'',birth:'1985-'+String(b.getMonth()+1).padStart(2,'0')+'-'+String(b.getDate()).padStart(2,'0'),address:'السويس',notes:'',grade:GR[i%2]})}});
  const base=new Date();const ids=db.students.map(s=>s.id);
  for(let w=4;w>=1;w--){const d=new Date(base);d.setDate(d.getDate()-7*w);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    db.att[k]={};db.ev[k]={};ids.forEach((id,i)=>{const r=(i*7+w*3)%10;db.att[k][id]=r<7?'P':r<9?'A':'E';if(db.att[k][id]==='P')db.ev[k][id]={h:String(3+(i+w)%3),l:String(2+(i+w)%4),r:String(3+(i*w)%3),n:''}})}
  syncAuto();save();render();toast('تمت إضافة بيانات تجريبية');
}

let FPH='';
const av=(s,z=38)=>s.photo?`<img class="av" src="${s.photo}" style="width:${z}px;height:${z}px" alt="">`:`<span class="av" style="width:${z}px;height:${z}px;font-size:${Math.round(z*.45)}px">${esc(((s.name||'').trim()[0])||'👤')}</span>`;

function cropImg(file,sz,cb){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=sz;
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)*(im.height>im.width?.2:.5),m,m,0,0,sz,sz);cb(c.toDataURL('image/jpeg',.8))};
    im.onerror=()=>toast('ملف الصورة غير صالح');im.src=fr.result};
  fr.readAsDataURL(file);
}

/* ---------- إدارة تواريخ الاجتماعات ---------- */
const cnt=o=>Object.keys(o||{}).length;
const allDates=()=>[...new Set([...Object.keys(db.att),...Object.keys(db.ev)])].filter(d=>cnt(db.att[d])||cnt(db.ev[d])).sort().reverse();
function dateMgr(){
  const ds=allDates();
  openM(`<div class="row sp"><h3 style="margin:0">🗓 تواريخ الاجتماعات</h3><button class="btn sm" data-act="closeM">✕</button></div>
  <p class="muted">لتعديل تاريخ: غيّره واضغط «حفظ» (ينتقل الحضور والتقييم للتاريخ الجديد). أو احذف الاجتماع بالكامل.</p>
  ${ds.length?`<div class="tw"><table>${ds.map(x=>`<tr><td><input type="date" id="nd-${x}" value="${x}"></td><td class="muted">حضور ${cnt(db.att[x])} • تقييم ${cnt(db.ev[x])}</td><td><button class="btn sm pri" data-act="dateMove" data-d="${x}">حفظ</button> <button class="btn sm dng" data-act="dateDel" data-d="${x}">🗑 حذف</button></td></tr>`).join('')}</table></div>`:'<div class="empty">لا توجد اجتماعات مسجلة</div>'}`);
}
function dateMove(o){
  const n=($('#nd-'+o)||{}).value;
  if(!n||n===o){toast('غيّر التاريخ أولًا');return}
  if(cnt(db.att[n])||cnt(db.ev[n])){toast('⚠ يوجد اجتماع مسجل بتاريخ '+fd(n)+' — احذفه أولًا أو اختر تاريخًا آخر');return}
  if(db.att[o]){db.att[n]=db.att[o];delete db.att[o]}
  if(db.ev[o]){db.ev[n]=db.ev[o];delete db.ev[o]}
  db.fu.forEach(f=>{if(f.sess===o){f.sess=n;if(f.auto)f.id='au_'+f.sid+'_'+n;if(f.open)f.date=n}});
  if(state.att===o)state.att=n;
  if(state.ev===o)state.ev=n;
  save();render();dateMgr();toast('تم تعديل التاريخ إلى '+fd(n));
}
function dateDel(d){
  if(!confirm('حذف اجتماع '+fd(d)+' نهائيًا؟\nسيُحذف الحضور ('+cnt(db.att[d])+') والتقييم ('+cnt(db.ev[d])+') المسجلين فيه.'))return;
  logEv('حذف اجتماع '+fd(d));delete db.att[d];delete db.ev[d];
  db.fu=db.fu.filter(f=>!(f.sess===d&&f.auto&&f.open));
  db.fu.forEach(f=>{if(f.sess===d)f.sess=''});
  save();render();dateMgr();toast('تم حذف الاجتماع');
}

let BG={};try{BG=JSON.parse(localStorage.getItem(BGK))||{}}catch(e){}
function saveBG(){try{localStorage.setItem(BGK,JSON.stringify(BG));return true}catch(e){toast('الصورة كبيرة على ذاكرة المتصفح، جرّب صورة أصغر');return false}}
function applyBG(){
  const r=document.documentElement.style,h=document.querySelector('header');
  const pg=BG.page===undefined?DEF_BG:BG.page;
  if(pg){r.setProperty('--pgbg','url("'+pg+'")');r.setProperty('--pgsz',BG.page===undefined?'contain':'cover');r.setProperty('--pgop',BG.op==null?.22:BG.op)}else r.removeProperty('--pgbg');
  document.body.classList.toggle('hasbg',!!pg);
  h.style.backgroundImage=BG.head?'linear-gradient(rgba(20,30,60,.5),rgba(20,30,60,.5)),url("'+BG.head+'")':'';
  h.style.backgroundSize='cover';h.style.backgroundPosition='center';
}
function loadImg(file,max,cb){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};
    im.onerror=()=>toast('ملف الصورة غير صالح');im.src=fr.result};
  fr.readAsDataURL(file);
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='bgPage'||t.id==='bgHead'){const f=t.files[0];if(!f)return;
    loadImg(f,t.id==='bgPage'?1400:1600,u=>{BG[t.id==='bgPage'?'page':'head']=u;if(saveBG()){applyBG();toast('تم تعيين الخلفية ✓')}})}
  else if(t.id==='bgOp'){BG.op=(+t.value)/100;saveBG()}
});
document.addEventListener('input',e=>{if(e.target.id==='bgOp'){BG.op=(+e.target.value)/100;document.documentElement.style.setProperty('--pgop',BG.op)}});

async function pbk(pw,saltB64){
  const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
  return b64e(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(saltB64),iterations:150000,hash:'SHA-256'},km,256)));
}
async function mkPw(pw){const s=b64e(crypto.getRandomValues(new Uint8Array(16)));return {salt:s,h:await pbk(pw,s)}}

const lgErr=m=>{const e=$('#lgE');if(e)e.textContent=m};
async function doLogin(){
  if(!window.crypto||!crypto.subtle){lgErr('المتصفح لا يدعم التشفير — افتح النظام من رابط https في Chrome أو Safari');return}
  const f=failSt(),now=Date.now();
  if(now<f.until){lgErr('محاولات كثيرة خاطئة. انتظر '+Math.ceil((f.until-now)/1000)+' ثانية');return}
  const raw=$('#lgU').value,un=nu(raw),pw=$('#lgP').value;
  if(!un||!pw){lgErr('اكتب اسم المستخدم وكلمة السر');return}
  const btn=$('#lgGo');btn.disabled=true;
  const u=db.users.find(x=>nu(x.un)===un&&x.on!==false);
  let ok=false;
  try{const h=await pbk(pw,u?u.salt:'AAAAAAAAAAAAAAAAAAAAAA==');ok=!!u&&teq(h,u.h)}catch(e){}
  btn.disabled=false;
  if(!ok){
    const n=f.n+1,wait=n>=3?Math.min(600,5*Math.pow(2,n-3)):0;
    try{localStorage.setItem(FAILK,JSON.stringify({n,until:wait?Date.now()+wait*1000:0}))}catch(e){}
    logEv('محاولة دخول فاشلة ('+raw.trim().slice(0,30)+')','—');
    $('#lgP').value='';lgErr('اسم المستخدم أو كلمة السر غير صحيحة'+(wait?' — انتظر '+wait+' ثانية قبل المحاولة التالية':''));return;
  }
  try{localStorage.removeItem(FAILK);localStorage.setItem(LUK,u.un)}catch(e){}
  ME=u;lastAct=Date.now();sessSave();logEv('تسجيل دخول');
  hideLock();applyTheme();render();toast('أهلًا '+u.name+' 👋');
}

  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(JSON.stringify(obj))));
  return JSON.stringify({enc:'YTB1',s:b64e(salt),i:b64e(iv),d:b64e(ct)});
}
async function decBackup(o,pw){
  const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(o.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.i)},k,b64d(o.d))));
}
async function expBackup(){
  if(!window.crypto||!crypto.subtle){toast('المتصفح لا يدعم التشفير');return}
  const pw=prompt('اكتب كلمة سر لتشفير النسخة الاحتياطية (6 أحرف فأكثر).\nاحتفظ بها: بدونها لا يمكن فتح النسخة.\n\nلنسخة غير مشفّرة (غير موصى بها) اتركها فاضية.');
  if(pw===null)return;
  if(!pw){
    if(!confirm('النسخة غير المشفّرة تحتوي كل بيانات الأعضاء (أسماء وتليفونات وعناوين) ويستطيع أي شخص يحصل على الملف قراءتها. متابعة بدون تشفير؟'))return;
    dl('نسخة_احتياطية_'+today()+'.json',JSON.stringify(Object.assign({},db,{users:[]})),'application/json');logEv('تصدير نسخة احتياطية (غير مشفّرة)');return;
  }
  if(pw.length<6){toast('كلمة السر 6 أحرف على الأقل');return}
  toast('جارٍ التشفير…');
  try{const o=await encBackup(db,pw);dl('نسخة_احتياطية_مشفرة_'+today()+'.json',o,'application/json');logEv('تصدير نسخة احتياطية مشفّرة');toast('تم تصدير النسخة المشفّرة ✓')}catch(e){toast('تعذر التشفير')}
}
async function restoreFile(text){
  try{
    let d=JSON.parse(text);
    if(d&&d.enc==='YTB1'){
      const pw=prompt('هذه النسخة مشفّرة. اكتب كلمة سر النسخة:');if(pw===null)return;
      try{d=await decBackup(d,pw)}catch(e){toast('⚠ كلمة السر غير صحيحة أو الملف تالف');return}
    }
    if(!d||!d.students)throw 0;
    if(!confirm('سيتم استبدال كل البيانات الحالية.'+(SYNC&&SYNC.on?' (والمزامنة مفعّلة فسيصل ذلك لباقي الأجهزة)':'')+' متابعة؟'))return;
    d.users=secOn()?db.users:(Array.isArray(d.users)?d.users:[]);
    logEv('استرجاع نسخة احتياطية');
    localStorage.setItem(KEY,JSON.stringify(d));db=load();syncAuto();applyTheme();render();schedSync();toast('تم الاسترجاع');
  }catch(x){toast('ملف غير صالح')}
}
